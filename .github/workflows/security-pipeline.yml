
name: Secure DevSecOps Pipeline

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Checkout
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 4. Create reports directory BEFORE all scanners
      - name: Prepare Reports Directory
        run: mkdir -p reports

      # 5. Gitleaks
      - name: Gitleaks Scan
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --report-format json --report-path reports/gitleaks.json --exit-code 0

      # 6. Semgrep
      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

      - name: Run Semgrep
        continue-on-error: true
        run: |
          semgrep scan \
            --config=auto . \
            --json \
            --output semgrep-results.json

          cp semgrep-results.json reports/semgrep-results.json

      # 7. Trivy
      - name: Run Trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-results.json
          exit-code: "0"

      - name: Copy Trivy Report
        if: always()
        run: |
          if [ -f trivy-results.json ]; then
            cp trivy-results.json reports/trivy-results.json
          fi

      # 8. Checkov
      - name: Checkov Scan
        continue-on-error: true
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          output_format: sarif
          output_file_path: reports/checkov-results.sarif
          soft_fail: true

      # 9. Install application dependencies
      - name: Install Backend Dependencies
        run: |
          if [ -f app/requirements.txt ]; then
            pip install -r app/requirements.txt
          fi

      - name: Install Frontend Dependencies
        working-directory: ecommerce
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # 10. Start chatbot
      - name: Start AI Chatbot Service
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AURA_AI_URL: ${{ secrets.AURA_AI_URL }}
          AURA_AI_TOKEN: ${{ secrets.AURA_AI_TOKEN }}
        run: |
          python app/app.py > /tmp/chatbot.log 2>&1 &
          echo $! > /tmp/chatbot.pid

          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5000/health; then
              echo "Chatbot started successfully."
              exit 0
            fi
            sleep 2
          done

          echo "Chatbot failed to start."
          cat /tmp/chatbot.log
          exit 1

      # 11. AI chatbot adversarial scanner
      - name: Run AI Chatbot Security Scanner
        continue-on-error: true
        env:
          API_URL: http://127.0.0.1:5000/api
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AURA_AI_URL: ${{ secrets.AURA_AI_URL }}
          AURA_AI_TOKEN: ${{ secrets.AURA_AI_TOKEN }}
        run: |
          python security/chatbot_agent_scanner.py

      # 12. Collect all reports
      - name: Collect Security Reports
        if: always()
        run: |
          mkdir -p reports

          if [ -f chatbot-agent-security.json ]; then
            cp chatbot-agent-security.json reports/
          fi

          echo "Reports available:"
          find reports -maxdepth 2 -type f -print

      # 13. Calculate risk score
      - name: Calculate Security Risk Score
        if: always()
        run: |
          python security/risk_score.py

      # 14. Upload reports
      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 30

      # 15. Stop chatbot
      - name: Stop Chatbot Service
        if: always()
        run: |
          if [ -f /tmp/chatbot.pid ]; then
            kill "$(cat /tmp/chatbot.pid)" || true
          fi
