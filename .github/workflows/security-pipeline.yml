name: Secure DevSecOps Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  security:
    runs-on: ubuntu-latest

    steps:

      # --------------------
      # Checkout Repository
      # --------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # --------------------
      # Setup Python
      # --------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # --------------------
      # Gitleaks Secret Scan
      # --------------------
      - name: Gitleaks Scan
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2

      # --------------------
      # Semgrep SAST Scan
      # --------------------
      - name: Install Semgrep
        run: |
          pip install semgrep

      - name: Run Semgrep
        continue-on-error: true
        run: |
          semgrep scan \
          --config=auto . \
          --json \
          --output semgrep-results.json

      # --------------------
      # Trivy Vulnerability Scan
      # --------------------
      # Trivy
      - name: Run Trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-results.json

      # --------------------
      # Checkov IaC Scan
      # --------------------
      # Checkov
      - name: Checkov Scan
        continue-on-error: true
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          output_format: sarif
          soft_fail: true
          skip_check: CKV_K8S_43

      # --------------------
      # AI Chatbot Dynamic Adversarial & Zero Data Leakage Scan
      # --------------------
      - name: Start AI Chatbot Service in Test Environment
        run: |
          pip install -r app/requirements.txt
          python app/app.py &
          echo "Waiting for Chatbot service on port 5000..."
          for i in {1..20}; do
            if curl -s http://localhost:5000/health | grep -q "healthy"; then
              echo "AI Chatbot is online and ready for security testing!"
              exit 0
            fi
            sleep 1
          done
          echo "Error: Chatbot failed to start"
          exit 1

      - name: Run AI Adversarial Prompt Injection & Data Leakage Scanner
        run: |
          python security/chatbot_agent_scanner.py

      # --------------------
      # Debug Generated Files
      # --------------------
      - name: Debug Files
        if: always()
        run: |
          echo "=== JSON Files ==="
          find . -name "*.json"

          echo "=== SARIF Files ==="
          find . -name "*.sarif"

      # --------------------
      # Risk Score Engine
      # --------------------
      - name: Calculate Security Risk Score
        run: |
          python security/risk_score.py

      # --------------------
      # Create Reports Folder
      # --------------------
      - name: Create Reports Directory
        if: always()
        run: |
          mkdir -p reports

          if [ -f semgrep-results.json ]; then
            cp semgrep-results.json reports/
          fi

          if [ -f trivy-results.json ]; then
            cp trivy-results.json reports/
          fi

          if [ -f results.sarif ]; then
            cp results.sarif reports/
          fi

          if [ -f reports/chatbot-agent-security.json ]; then
            cp reports/chatbot-agent-security.json reports/
          fi

      # --------------------
      # Upload Reports
      # --------------------
      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/

      # --------------------
      # Publish Findings to DevSecOps Dashboard
      # --------------------
      - name: Publish Findings to DevSecOps Dashboard
        if: always()
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
        run: |
          python -c "
          import os, json, urllib.request
          dashboard_url = os.environ.get('DASHBOARD_URL')
          if not dashboard_url:
              print('[INFO] DASHBOARD_URL secret not set. Reports preserved in GitHub Artifacts.')
              exit(0)
          payload = {'commitSha': os.environ.get('GITHUB_SHA', 'ci-run'), 'branch': os.environ.get('GITHUB_REF_NAME', 'main')}
          try:
              req = urllib.request.Request(f'{dashboard_url.rstrip(\"/\")}/api/security/ingest-ci-results', data=json.dumps(payload).encode('utf-8'), headers={'Content-Type': 'application/json'}, method='POST')
              with urllib.request.urlopen(req, timeout=10) as r:
                  print('[SUCCESS] Transmitted findings to DevSecOps Dashboard!')
          except Exception as e:
              print(f'[-] Warning transmitting to dashboard: {e}')
          "
