name: Secure DevSecOps Pipeline

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  security:
    name: Automated Security Assessment
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # 1. Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up runtimes
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 3. Prepare report directory and install Python dependencies once
      - name: Prepare Reports Directory
        run: mkdir -p reports

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f app/requirements.txt ]; then
            pip install -r app/requirements.txt
          fi

      # 4. Semgrep SAST
      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        continue-on-error: true
        run: |
          semgrep scan \
            --config=auto \
            --json \
            --output=reports/semgrep-results.json \
            .

      # 5. Trivy filesystem, dependency and configuration scan
      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          format: json
          output: reports/trivy-results.json
          exit-code: "0"

      # 6. Checkov infrastructure-as-code scan
      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov
        continue-on-error: true
        run: |
          checkov -d . \
            --framework all \
            --output sarif \
            --output-file-path reports/checkov-results.sarif \
            --soft-fail

      # 7. Install frontend dependencies and validate frontend build
      - name: Install Frontend Dependencies
        working-directory: ecommerce
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi