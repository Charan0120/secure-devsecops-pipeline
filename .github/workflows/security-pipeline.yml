
name: Secure DevSecOps Pipeline

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  security:
    name: Automated Security Assessment
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # 1. Checkout
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 4. Prepare reports
      - name: Prepare Reports Directory
        run: mkdir -p reports

      # 5. Install Semgrep
      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

      # 6. Semgrep scan
      - name: Run Semgrep
        continue-on-error: true
        run: |
          semgrep scan \
            --config=auto \
            --json \
            --output=reports/semgrep-results.json \
            .

      # 7. Trivy filesystem scan
      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          format: json
          output: reports/trivy-results.json
          exit-code: "0"

      # 8. Install Checkov
      - name: Install Checkov
        run: pip install checkov

      # 9. Checkov repository scan
      - name: Run Checkov
        continue-on-error: true
        run: |
          checkov -d . \
            --framework all \
            --output sarif \
            --output-file-path reports/checkov-results.sarif \
            --soft-fail

      # 10. Install backend dependencies
      - name: Install Backend Dependencies
        run: |
          if [ -f app/requirements.txt ]; then
            pip install -r app/requirements.txt
          fi

      # 11. Install frontend dependencies
      - name: Install Frontend Dependencies
        working-directory: ecommerce
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # 12. Start chatbot backend
      - name: Start AI Chatbot Service
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AURA_AI_URL: ${{ secrets.AURA_AI_URL }}
          AURA_AI_TOKEN: ${{ secrets.AURA_AI_TOKEN }}
        run: |
          python app/app.py > /tmp/chatbot.log 2>&1 &
          echo $! > /tmp/chatbot.pid

          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5000/health; then
              echo "Chatbot started."
              exit 0
            fi
            sleep 2
          done

          cat /tmp/chatbot.log
          exit 1

      # 13. AI chatbot security testing
      - name: Run AI Chatbot Security Scanner
        continue-on-error: true
        env:
          API_URL: http://127.0.0.1:5000/api
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AURA_AI_URL: ${{ secrets.AURA_AI_URL }}
          AURA_AI_TOKEN: ${{ secrets.AURA_AI_TOKEN }}
        run: |
          python security/chatbot_agent_scanner.py

      # 14. Collect all scanner reports
      - name: Collect Security Reports
        if: always()
        run: |
          mkdir -p reports

          if [ -f chatbot-agent-security.json ]; then
            cp chatbot-agent-security.json reports/
          fi

          echo "Generated reports:"
          find reports -type f -maxdepth 3 -print

      # 15. Calculate risk score
      - name: Calculate Security Risk Score
        if: always()
        run: |
          python security/risk_score.py || true

      # 16. Upload reports
      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/
          if-no-files-found: error
          retention-days: 30

      # 17. Stop chatbot
      - name: Stop Chatbot Service
        if: always()
        run: |
          if [ -f /tmp/chatbot.pid ]; then
            kill "$(cat /tmp/chatbot.pid)" || true
          fi
